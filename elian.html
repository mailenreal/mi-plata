<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEE8DD"><title>Mai &amp; Elian</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mai & Elian">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEE8DD;--card:#FBF8F3;--chip:#E5DDD0;--bo:#C9B9A1;--coral:#E8735A;--coralsoft:#F3C2B4;--ink:#171513;--muted:#7C7166;--line:rgba(23,21,19,.08);--ok:#3F6B4E;--okbg:#DCE6D9;--bad:#A8372B;--badbg:#F4D9D1;--oninv:#F4EFE7;
 --head:'Inter Tight','Inter',system-ui,sans-serif;--sans:'Inter',system-ui,-apple-system,sans-serif;--shadow:0 1px 2px rgba(23,21,19,.04),0 6px 18px rgba(23,21,19,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 60px}
h1{font-family:var(--head);font-weight:500;font-size:36px;letter-spacing:-.04em;line-height:1;margin:10px 0 18px}
h2{font-family:var(--head);font-weight:500;font-size:20px;letter-spacing:-.02em;margin:28px 4px 12px}
.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:18px;margin-bottom:10px}
.big{font-family:var(--head);font-weight:500;font-size:40px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:500;font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:var(--ink);color:var(--oninv);border-color:var(--ink)}
label.f{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:14px 0 6px}
input{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink)}
input.monto{font-family:var(--head);font-weight:500;font-size:44px;letter-spacing:-.04em;text-align:center;border-radius:28px}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:16px;font:inherit;font-weight:600;background:var(--ink);color:var(--oninv);cursor:pointer;margin-top:14px;text-align:center}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.coral{background:var(--coral);color:var(--ink)}
.btn:disabled{opacity:.5}.lnk{background:none;border:0;color:#B5452E;font:inherit;font-size:13px;cursor:pointer;padding:0}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.list .it:last-child{border:0}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.bar{height:10px;background:rgba(23,21,19,.08);border-radius:99px;margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:500;font-size:16px}
.logo{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:15px;background:var(--coralsoft)}.logo .pig{width:32px;height:32px}
.bal{background:var(--ink);color:var(--oninv)}.bal .muted{color:#B9AE9F}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--oninv);padding:12px 18px;border-radius:999px;font-weight:500;z-index:9}
.hide{display:none!important}.preview{background:var(--chip);border-radius:16px;padding:10px 12px;font-size:14px;margin-top:12px}
</style></head><body><main id="app"></main><div id="toast" class="toast hide"></div>
<script>
const API=location.hostname==='localhost'?'/exec':'https://script.google.com/macros/s/AKfycbyovSNcRv-IU1XPDOZdomY9p29oseEWumf8xpyekAmBYpZ4zSoBOcZtDCH9i9eJlyky/exec';
const PIG='<svg class="pig" aria-hidden="true" viewBox="0 0 64 64" fill="none" stroke="#171513" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"> <path d="M12.3 31.5C8 32 5.5 30 6.2 27.4c.6-2.2 3.6-2.2 3.9-.2.2 1.5-1.4 2.4-2.6 1.6"/> <path d="M15 46v7h7v-4.5M38 48.5V53h7v-7.5" fill="#E8735A"/> <path d="M12 34c0-11 10-18 22-18 4 0 7.5.8 10.5 2.2L50 13l1.2 8.3c2.3 2.2 3.8 4.7 4.4 7.4H58c1.7 0 3 1.3 3 3v5c0 1.7-1.3 3-3 3h-3c-2.5 5.2-8.6 9.3-21 9.3S12 43 12 34z" fill="#E8735A"/> <path d="M27 21.5h9"/> <circle cx="47" cy="28.5" r="1.2" fill="#171513" stroke="none"/> <path d="M57.5 33v2.5"/></svg>';
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ars=n=>{const v=Math.round(Number(n)||0);return(v<0?'-':'')+'$'+Math.abs(v).toLocaleString('es-AR')};
const usd=n=>'US$'+Math.round(Number(n)||0).toLocaleString('es-AR');
const num=s=>Number(String(s||'').replace(/\./g,'').replace(',','.'))||0;
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let SES=LS.get('me_sesion')||'',D=null;
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(tT);tT=setTimeout(()=>t.classList.add('hide'),3000)}
async function call(b){const r=await fetch(API,{method:'POST',body:JSON.stringify(Object.assign({sesion:SES},b))}).then(r=>r.json());
  if(r.error==='SESION'){SES='';LS.set('me_sesion','');login();throw new Error('Entrá de nuevo')} if(!r.ok)throw new Error(r.error);return r.data}
function login(err){
  $('#app').innerHTML=`<div class="logo" style="width:88px;height:88px;border-radius:28px;margin:30px 0 4px">${PIG.replace('class="pig"','class="pig" style="width:64px;height:64px"')}</div>
   <h1>Mai &amp; Elian</h1><div class="card"><div class="small muted">Gastos compartidos y metas juntos.</div>
   <label class="f">Tu PIN (te lo pasa Mai)</label><input id="p" type="password" inputmode="numeric"><button class="btn" id="go">Entrar</button>
   <p class="small" style="color:var(--bad)">${esc(err||'')}</p></div>`;
  $('#go').onclick=async()=>{$('#go').disabled=true;try{const r=await fetch(API,{method:'POST',body:JSON.stringify({action:'login',pin:$('#p').value.trim()})}).then(r=>r.json());
    if(!r.ok)throw new Error(r.error);if(r.data.rol!=='elian')throw new Error('Ese PIN no es el de Elian');SES=r.data.sesion;LS.set('me_sesion',SES);cargar()}catch(e){login(e.message)}};
}
async function cargar(){
  const c=LS.get('me_cache');if(c&&!D){try{D=JSON.parse(c);render()}catch(e){}}
  if(!D)$('#app').innerHTML='<p class="muted">Cargando…</p>';
  try{D=await call({action:'compInicio'});LS.set('me_cache',JSON.stringify(D));render()}catch(e){if(SES)toast(e.message)}
}
const fd=x=>x?new Date(x).toLocaleDateString('es-AR',{day:'numeric',month:'numeric'}):'';
function render(){
  const b=D.balance;// + = Elian le debe a Mai
  $('#app').innerHTML=`<div class="brand"><span class="logo">${PIG}</span><span>Mai &amp; Elian</span></div><h1>Nuestras cuentas</h1>
   <div class="card bal"><div class="small muted">${b>0?'Le debés a Mai':b<0?'Mai te debe':'Están a mano'}</div><div class="big">${ars(Math.abs(b))}</div></div>
   <button class="btn coral" id="nuevo">+ Gasto compartido</button><button class="btn sec" id="pago">Registrar un pago entre nosotros</button>
   ${D.metas.length?`<h2>Metas juntos</h2>${D.metas.map(m=>{const falta=Math.max(0,m.total-m.mai-m.elian),p=m.total?Math.min(100,(m.mai+m.elian)/m.total*100):0;
     return `<div class="card"><div class="row between"><b>${esc(m.nombre)}</b><span class="small muted">${m.fecha?new Date(m.fecha).toLocaleDateString('es-AR',{month:'short',year:'numeric'}):''}</span></div>
     <div class="bar"><i style="width:${p}%"></i></div><div class="kv"><span>Total</span><b>${usd(m.total)}</b></div>
     <div class="kv"><span>Puse yo</span><b>${usd(m.elian)} <span class="tiny muted">de ${usd(m.total*(1-m.parteMai))}</span></b></div>
     <div class="kv"><span>Puso Mai</span><b>${usd(m.mai)} <span class="tiny muted">de ${usd(m.total*m.parteMai)}</span></b></div>
     <div class="kv"><span>Falta</span><b>${usd(falta)}</b></div><button class="btn sec" data-ap="${m.id}" style="margin-top:8px">Sumar mi aporte</button></div>`}).join('')}`:''}
   <h2>Movimientos</h2><div class="card">${D.lista.length?`<div class="list">${D.lista.map(x=>`<div class="it"><span>${esc(x.que)}<span class="tiny muted"> · ${fd(x.fecha)}${x.cat==='SALDO'?'':' · pagó '+(x.pago==='Mai'?'Mai':'yo')+' · mi parte '+ars(x.total*(1-x.parteMai))}</span></span>
     <span style="text-align:right"><b>${ars(x.total)}</b>${x.cargo==='Elian'&&x.enPlanilla!=='sí'?`<br><button class="lnk tiny" data-del="${x.id}">borrar</button>`:''}</span></div>`).join('')}</div>`:'<span class="small muted">Todavía no hay nada.</span>'}</div>
   <button class="lnk" id="salir" style="margin-top:20px">Cerrar sesión</button>`;
  $('#nuevo').onclick=()=>form();$('#pago').onclick=()=>pago();
  $('#salir').onclick=()=>{SES='';LS.set('me_sesion','');LS.set('me_cache','');D=null;login()};
  $$('[data-del]').forEach(el=>el.onclick=async()=>{if(!confirm('¿Borrar este gasto?'))return;try{D=await call({action:'compBorrar',id:el.dataset.del});render()}catch(e){toast(e.message)}});
  $$('[data-ap]').forEach(el=>el.onclick=async()=>{const v=prompt('¿Cuántos USD sumás?');if(!num(v))return;try{D=await call({action:'compAportar',id:el.dataset.ap,usd:num(v)});render();toast('Aporte sumado')}catch(e){toast(e.message)}});
}
const CATS=[['COMIDA','Comida'],['ACTIVIDADES','Salidas'],['CASA','Casa'],['VIAJES','Viajes'],['REGALOS','Regalos'],['VARIOS','Otro']];
function chips(k,opts,val){return `<div class="chips">${opts.map(([v,l])=>`<span class="chip ${v===val?'on':''}" data-k="${k}" data-v="${v}">${l}</span>`).join('')}</div>`}
function form(){
  const f={que:'',monto:'',cat:'COMIDA',pago:'Elian',div:'mitad',pct:'',fecha:hoy()};
  const r=()=>{const pm=f.div==='otro'?Math.min(100,Math.max(0,num(f.pct)))/100:0.5,m=num(f.monto);
    $('#app').innerHTML=`<button class="lnk" id="volver">‹ Volver</button><h1>Gasto compartido</h1>
     <label class="f">Qué fue</label><input id="q" value="${esc(f.que)}" placeholder="Ej: Merienda, Súper, Nafta">
     <label class="f">Total</label><input id="m" class="monto" inputmode="decimal" placeholder="0" value="${esc(f.monto)}">
     <label class="f">Categoría</label>${chips('cat',CATS,f.cat)}
     <label class="f">¿Quién pagó?</label>${chips('pago',[['Elian','Yo'],['Mai','Mai']],f.pago)}
     <label class="f">¿Cómo se divide?</label>${chips('div',[['mitad','Mitad'],['otro','Otro']],f.div)}
     ${f.div==='otro'?`<label class="f">Parte de Mai (%)</label><input id="pct" inputmode="decimal" value="${esc(f.pct)}" placeholder="Ej: 40">`:''}
     <label class="f">Fecha</label><input id="fe" type="date" value="${f.fecha}">
     <div class="preview ${m?'':'hide'}" id="pv"></div>
     <button class="btn" id="g">Guardar</button>`;
    const rd=()=>{f.que=$('#q').value;f.monto=$('#m').value;f.fecha=$('#fe').value;const p=$('#pct');if(p)f.pct=p.value};
    $('#volver').onclick=render;$$('[data-k]').forEach(el=>el.onclick=()=>{rd();f[el.dataset.k]=el.dataset.v;r()});
    const pv=()=>{rd();const pm2=f.div==='otro'?Math.min(100,Math.max(0,num(f.pct)))/100:0.5,m2=num(f.monto),e=$('#pv');e.classList.toggle('hide',!m2);
      e.innerHTML=f.pago==='Elian'?`Mai te debe <b>${ars(m2*pm2)}</b>`:`Le debés a Mai <b>${ars(m2*(1-pm2))}</b>`};
    $('#m').oninput=pv;const p=$('#pct');if(p)p.oninput=pv;pv();
    $('#g').onclick=async()=>{rd();if(!f.que.trim())return toast('Poné qué fue');if(!(num(f.monto)>0))return toast('Poné el monto');
      $('#g').disabled=true;try{D=await call({action:'compCargar',que:f.que,total:num(f.monto),cat:f.cat,pago:f.pago,parteMai:f.div==='otro'?num(f.pct)/100:0.5,fecha:f.fecha});LS.set('me_cache',JSON.stringify(D));render();toast('Guardado')}catch(e){toast(e.message);$('#g').disabled=false}};};
  r();
}
function pago(){
  let q='Elian';const b=D.balance;
  const r=()=>{$('#app').innerHTML=`<button class="lnk" id="volver">‹ Volver</button><h1>Pago entre nosotros</h1>
    <label class="f">¿Quién le pagó a quién?</label>${chips('q',[['Elian','Yo le pagué a Mai'],['Mai','Mai me pagó']],q)}
    <label class="f">Monto</label><input id="m" class="monto" inputmode="decimal" placeholder="${Math.round(Math.abs(b))||0}">
    <button class="btn" id="g">Guardar</button>`;
    $('#volver').onclick=render;$$('[data-k]').forEach(el=>el.onclick=()=>{q=el.dataset.v;r()});
    $('#g').onclick=async()=>{const m=num($('#m').value);if(!(m>0))return toast('Poné el monto');$('#g').disabled=true;
      try{D=await call({action:'compCargar',cat:'SALDO',total:m,pago:q});render();toast('Guardado')}catch(e){toast(e.message);$('#g').disabled=false}};};
  r();
}
if(SES)cargar();else login();
</script></body></html>
