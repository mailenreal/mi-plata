<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEE8DD"><title>Mi Plata</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Mi Plata">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json">
<style>html,body{margin:0;background:#EEE8DD;height:100%}.l{height:100%;display:flex;align-items:center;justify-content:center}.l div{width:88px;height:88px;border-radius:28px;background:#F3C2B4;display:flex;align-items:center;justify-content:center;animation:p 1s infinite alternate}.l svg{width:64px;height:64px}@keyframes p{to{transform:scale(.92)}}</style>
</head><body><div class="l"><div><svg class="pig" aria-hidden="true" viewBox="0 0 64 64" fill="none" stroke="#171513" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"> <path d="M12.3 31.5C8 32 5.5 30 6.2 27.4c.6-2.2 3.6-2.2 3.9-.2.2 1.5-1.4 2.4-2.6 1.6"/> <path d="M15 46v7h7v-4.5M38 48.5V53h7v-7.5" fill="#E8735A"/> <path d="M12 34c0-11 10-18 22-18 4 0 7.5.8 10.5 2.2L50 13l1.2 8.3c2.3 2.2 3.8 4.7 4.4 7.4H58c1.7 0 3 1.3 3 3v5c0 1.7-1.3 3-3 3h-3c-2.5 5.2-8.6 9.3-21 9.3S12 43 12 34z" fill="#E8735A"/> <path d="M27 21.5h9"/> <circle cx="47" cy="28.5" r="1.2" fill="#171513" stroke="none"/> <path d="M57.5 33v2.5"/></svg></div></div>
<script>
// Cargador: siempre trae la última versión de la app (nunca queda una vieja guardada en el celu)
(function(){
  var KEY='mp_app_html',cached=null;try{cached=localStorage.getItem(KEY)}catch(e){}
  var listo=false;function pintar(h){if(listo)return;listo=true;document.open();document.write(h);document.close()}
  var t=setTimeout(function(){if(cached)pintar(cached)},4000);
  fetch('app.html?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()})
    .then(function(h){clearTimeout(t);try{localStorage.setItem(KEY,h)}catch(e){}pintar(h)})
    .catch(function(){clearTimeout(t);if(cached)pintar(cached);else document.body.innerHTML='<p style="font:16px system-ui;padding:40px;text-align:center">Sin conexión. Probá de nuevo en un rato.</p>'});
})();
</script></body></html>
